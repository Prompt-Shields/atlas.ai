[project]
name = "aigrc-worker"
version = "0.1.0"
description = "AI-GRC Platform - Worker Service"
requires-python = ">=3.12"
dependencies = [
    "aigrc-backend @ file:///${PROJECT_ROOT}/../backend",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "croniter>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
