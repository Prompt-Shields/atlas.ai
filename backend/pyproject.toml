[project]
name = "aigrc-backend"
version = "0.1.0"
description = "AI-GRC Platform - Backend API"
requires-python = "~=3.12"
dependencies = [
    "fastapi~=0.131.0",
    "uvicorn~=0.41.0",
    "uvloop~=0.21.0",
    "pydantic~=2.11.0",
    "pydantic-settings~=2.13.1",
    "sqlalchemy~=2.0.46",
    "greenlet~=3.2.0",
    "asyncpg~=0.31.0",
    "alembic~=1.18.4",
    "pgvector~=0.4.2",
    "python-jose~=3.5.0",
    "argon2-cffi~=25.1.0",
    "python-multipart~=0.0.22",
    "httpx~=0.28.1",
    "itsdangerous~=2.2.0",
    "aiosmtplib~=5.1.0",
    "email-validator~=2.3.0",
    "semantic-kernel~=1.39.4",
    "opentelemetry-api~=1.39",
    "opentelemetry-sdk~=1.39",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-instrumentation-sqlalchemy==0.60b0",
    "opentelemetry-instrumentation-httpx==0.60b0",
    "opentelemetry-exporter-otlp~=1.39",
    "azure-monitor-opentelemetry-exporter==1.0.0b48",
    "redis~=7.2.0",
    "sse-starlette~=3.2.0",
    "structlog~=25.5.0",
    "tenacity~=9.1.4",
    "croniter~=6.0.0",
    "stripe~=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=1.3.0",
    "pytest-cov~=7.0.0",
    "pytest-httpx~=0.36.0",
    "httpx~=0.28.1",
    "factory-boy~=3.3.3",
    "faker~=40.4.0",
    "ruff~=0.15.2",
    "mypy~=1.19.1",
    "pre-commit~=4.5.1",
    "aiosqlite~=0.22.1",
]

[build-system]
requires = ["hatchling~=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = [
    "B008",
    "B904",
    "E501",
    "N806",
    "N818",
    "PT018",
    "RUF001",
    "RUF003",
    "RUF012",
    "RUF059",
    "RUF100",
    "S101",
    "S104",
    "S105",
    "S106",
    "S110",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    # Applied automatically to everything under tests/unit/ by the
    # pytest_collection_modifyitems hook in tests/conftest.py — CI selects on
    # it, so deriving it from the directory keeps a new file from silently
    # falling out of the run.
    "unit: Unit tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    # Registered so --strict-markers tells the truth about it. One file
    # carries this marker; it lives under tests/unit/ and so also runs as a
    # unit test.
    "integration: Integration tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "misc",
    "no-any-return",
]
