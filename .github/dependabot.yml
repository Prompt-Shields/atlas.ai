# Dependency update pull requests (Prompt-Shields/promptly-guide#88, E18: vulnerability
# management, ISO A.8.8). One entry per ecosystem this repository has: the workflow
# actions, the backend's and worker's Python (pyproject.toml) and the frontend's npm.
# Weekly, grouped and few at a time, so a small team can keep up. Minor and patch
# updates come as one pull request per ecosystem; a major update comes on its own,
# because it is the one that needs reading. Majors of the SDKs and frameworks listed
# under `ignore` do not come at all: those are migrations, done on purpose.
#
# Docker base images are left out: the Dockerfiles use moving tags (python:3.12-slim,
# node:20-alpine) that pick up patched images on every build, and Dependabot would only
# propose new language versions, which are decisions, not updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: pip
    directories:
      - /backend
      - /worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # The OpenTelemetry packages pin each other exactly (api/sdk 1.x, the
      # instrumentation 0.xxb0 betas, and the Azure Monitor exporter beta that pins
      # api/sdk), so one alone never resolves: they come as one pull request, of any
      # update type. Listed first, because a dependency joins the first group it matches.
      opentelemetry:
        patterns:
          - "opentelemetry-*"
          - "azure-monitor-opentelemetry*"
      python-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          - "opentelemetry-*"
          - "azure-monitor-opentelemetry*"
    # SDKs and frameworks whose majors are migrations, not updates: they are upgraded
    # deliberately, on a branch that reads the changelog. Our billing tests fake the
    # Stripe client, so a green major Stripe PR proves nothing about the real SDK.
    ignore:
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Framework-level majors (the compiler, Next.js, React and the lint stack built on
    # them) need a migration and move together; they are upgraded deliberately.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/postcss"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(npm)"
