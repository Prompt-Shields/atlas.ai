name: CD - Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (from dev build)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_PROD }}
  ACR_NAME: ${{ vars.ACR_NAME_PROD }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER_PROD }}

jobs:
  promote-images:
    name: Promote Images to Prod ACR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Import images from dev ACR
        run: |
          for image in aigrc-backend aigrc-worker aigrc-frontend; do
            az acr import \
              --name ${{ env.ACR_NAME }} \
              --source ${{ vars.ACR_LOGIN_SERVER_DEV }}/${image}:${{ inputs.image_tag }} \
              --image ${image}:${{ inputs.image_tag }}
            az acr import \
              --name ${{ env.ACR_NAME }} \
              --source ${{ vars.ACR_LOGIN_SERVER_DEV }}/${image}:${{ inputs.image_tag }} \
              --image ${image}:prod-latest \
              --force
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: promote-images
    environment:
      name: production
      # Requires manual approval configured in GitHub Environment settings

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_PROD }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/environments/prod.bicepparam
          failOnStdErr: false

      - name: Verify deployment health
        run: |
          sleep 60
          FRONTEND_URL=$(az containerapp show -n aigrc-prod-frontend -g ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          curl -sf "https://${FRONTEND_URL}" || echo "Warning: Frontend health check failed"
