name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  checks: write

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aigrc
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aigrc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/

      # alembic/env.py builds the app Settings to resolve the database URL, and
      # JWT_SECRET_KEY is the other field with no default — without it these
      # steps die on a pydantic ValidationError before touching the database.
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aigrc:testpassword@localhost:5432/aigrc_test
          JWT_SECRET_KEY: test_jwt_secret_ci_only
        run: python -m alembic upgrade head

      # The test suite builds its schema from Base.metadata.create_all and never
      # runs a migration, so nothing else here notices when the two drift apart.
      - name: Check migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aigrc:testpassword@localhost:5432/aigrc_test
          JWT_SECRET_KEY: test_jwt_secret_ci_only
        run: python -m alembic check

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aigrc:testpassword@localhost:5432/aigrc_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_jwt_secret_ci_only
          APP_ENV: testing
          EMAIL_BACKEND: console
          AZURE_OPENAI_ENDPOINT: https://placeholder.openai.azure.com/
          AZURE_OPENAI_API_KEY: test-key
          SUPER_ADMIN_EMAIL: admin@test.local
          SUPER_ADMIN_PASSWORD: TestAdmin_P@ss1
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing -m "unit"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aigrc-backend:test ./backend

      - name: Build frontend image
        run: docker build -t aigrc-frontend:test ./frontend

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 5
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run E2E tests
        working-directory: backend
        env:
          E2E_API_URL: http://localhost:8001/api/v1
          DATABASE_URL: postgresql+asyncpg://aigrc:testpassword@localhost:5433/aigrc_test
          JWT_SECRET_KEY: test_jwt_secret_e2e
          APP_ENV: testing
          SUPER_ADMIN_EMAIL: admin@test.local
          SUPER_ADMIN_PASSWORD: TestAdmin_P@ss1
        run: pytest tests/e2e/ -v -m "e2e"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
